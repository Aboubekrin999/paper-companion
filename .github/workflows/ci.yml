name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web:
    name: web (typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # `next build` is deferred until Supabase env vars exist on Vercel.
      # The auth middleware reads NEXT_PUBLIC_SUPABASE_URL at request time,
      # so build itself succeeds even without env, but adding it later
      # alongside the env wiring is cleaner.

  api:
    name: api (tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: api/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Import FastAPI app
        run: python -c "from api.index import app; print(f'Loaded {app.title} v{app.version}')"
      - run: pytest
